spring.application.name=APIGatewayApplication
server.port=9872

spring.profiles.active=prod


# BLOG
spring.cloud.gateway.routes[0].id=blogging-blog
spring.cloud.gateway.routes[0].uri=lb://BloggingPlatform
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/blog,/api/blog/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

