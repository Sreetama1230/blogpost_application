spring.application.name=Blogging_Platform
spring.profiles.active=prod

spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST

spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=false

spring.kafka.admin.fail-fast=false
spring.kafka.listener.missing-topics-fatal=false

moderation.service.url  = http://localhost:8089
management.endpoints.web.exposure.include=info,metrics,health

resilience4j.retry.instances.moderationService.max-attempts=3
resilience4j.retry.instances.moderationService.wait-duration=2s


resilience4j.circuitbreaker.instances.moderationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.moderationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.moderationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.moderationService.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.moderationService.permitted-number-of-calls-in-half-open-state=3
